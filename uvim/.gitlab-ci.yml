stages:
  - test

variables:
  DEBIAN_FRONTEND: noninteractive

default:
  image: debian:bookworm-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential gcc make gawk libncurses-dev ca-certificates
    - rm -rf /var/lib/apt/lists/*

build_and_test:
  stage: test
  script:
    - |
      set -euxo pipefail
      cd src
      rm -f auto/config.cache
      NPROC="$(nproc)"
      ./configure \
        --with-features=tiny \
        --disable-gui \
        --without-x \
        --disable-nls \
        --disable-gpm \
        --disable-sysmouse \
        --disable-acl \
        --disable-netbeans \
        --disable-channel \
        --enable-fail-if-missing | tee configure.log
      make -j"${NPROC}" | tee build.log
      ./uvim --version | head -n 1
      make test | tee test.log
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - src/configure.log
      - src/build.log
      - src/test.log
