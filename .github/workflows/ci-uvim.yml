name: CI uVim

on:
  push:
    paths:
      - 'uvim/**'
      - '.github/workflows/ci-uvim.yml'
  pull_request:
    paths:
      - 'uvim/**'
      - '.github/workflows/ci-uvim.yml'
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  uvim:
    runs-on: ubuntu-latest
    env:
      UVIM_CONFIGURE_FLAGS: >-
        CONF_OPT_GUI=--disable-gui
        CONF_OPT_X=--without-x
        CONF_OPT_NLS=--disable-nls
        CONF_OPT_ACL=--disable-acl
        CONF_OPT_GPM=--disable-gpm
        CONF_OPT_NETBEANS=--disable-netbeans
        CONF_OPT_CHANNEL=--disable-channel
        CONF_OPT_FEAT=--with-features=normal
      TERM: xterm
      LINES: "40"
      COLUMNS: "120"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gettext \
            libncurses-dev

      - name: Configure and build
        shell: bash
        working-directory: uvim/src
        run: |
          set -euxo pipefail
          make ${UVIM_CONFIGURE_FLAGS} reconfig

      - name: Run uVim tests
        shell: bash
        working-directory: uvim/src
        run: |
          set -euxo pipefail
          make unittest

          # The inherited Vim testdir suite depends on Vimscript features that
          # this fork intentionally removes, so validate the supported script
          # input path directly instead.
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          printf 'iabc\010\033:wq!\r' > "$tmpdir/backspace.script"
          VIMRUNTIME=../runtime ./uvim \
            -f \
            -n \
            -i NONE \
            -u NONE \
            -U NONE \
            --noplugin \
            --not-a-term \
            -s "$tmpdir/backspace.script" \
            "$tmpdir/backspace.txt" \
            > "$tmpdir/smoke.log" 2>&1

          printf 'ab\n' > "$tmpdir/expected.txt"
          diff -u "$tmpdir/expected.txt" "$tmpdir/backspace.txt"
          cp "$tmpdir/smoke.log" testdir/smoke.log

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uvim-test-logs
          path: |
            uvim/src/testdir/test.log
            uvim/src/testdir/messages
            uvim/src/testdir/*.failed
            uvim/src/testdir/smoke.log
          if-no-files-found: ignore
