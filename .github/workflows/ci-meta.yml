name: CI Meta

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  meta:
    name: Validate metadata generator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            meta/requirements.txt
            meta/pyproject.toml
            meta/poetry.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r meta/requirements.txt
          python -m pip install ./meta

      - name: Compile Python sources
        run: |
          python -m compileall meta/meta

      - name: Smoke import metadata generator
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "meta.run.generate_fabric",
              "meta.run.generate_forge",
              "meta.run.generate_java",
              "meta.run.index",
          ]

          for name in modules:
              importlib.import_module(name)
              print(f"imported {name}")
          PY
