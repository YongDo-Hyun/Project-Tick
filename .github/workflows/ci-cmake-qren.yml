name: CI libqrencode CMake-build

on:
  push:
    paths:
      - 'libqrencode/**'
      - '.github/workflows/ci-cmake-qren.yml'
  pull_request:
    paths:
      - 'libqrencode/**'
      - '.github/workflows/ci-cmake-qren.yml'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v2

    - name: run vcpkg
      if: matrix.os == 'windows-latest'
      uses: lukka/run-vcpkg@v6
      with:
          vcpkgArguments: getopt:x64-windows libiconv:x64-windows libpng:x64-windows
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '2a42024b53ebb512fb5dd63c523338bf26c8489c'
          appendedCacheKey: ${{ hashFiles( '${{ github.workspace }}/.github/workflows/cmake.yml' ) }}

    - name: brew setup
      if: matrix.os == 'macos-latest'
      run: brew install pkg-config libpng

    - name: Configure CMake
      if: matrix.os != 'windows-latest'
      shell: bash
      working-directory: libqrencode
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DWITH_TESTS=yes -DBUILD_SHARED_LIBS=on

    - name: Configure CMake for Windows
      if: matrix.os == 'windows-latest'
      shell: bash
      working-directory: libqrencode
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DWITH_TESTS=yes

    - name: Build
      working-directory: libqrencode
      shell: bash
      run: cmake --build build --config $BUILD_TYPE -j 2

    - name: Test
      working-directory: libqrencode/build
      shell: bash
      run: ctest -C $BUILD_TYPE
