name: CI libqrencode CMake-build

on:
  push:
    paths:
      - 'libqrencode/**'
      - '.github/workflows/ci-cmake-qren.yml'
  pull_request:
    paths:
      - 'libqrencode/**'
      - '.github/workflows/ci-cmake-qren.yml'
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
      with:
        egress-policy: audit
    - uses: actions/checkout@v4

    - name: Set up vcpkg cache
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v4
      with:
        path: C:/vcpkg/installed
        key: ${{ runner.os }}-qren-vcpkg-${{ hashFiles('.github/workflows/ci-cmake-qren.yml') }}
        restore-keys: ${{ runner.os }}-qren-vcpkg-

    - name: Install vcpkg dependencies
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        vcpkg install getopt:x64-windows libiconv:x64-windows libpng:x64-windows

    - name: brew setup
      if: matrix.os == 'macos-latest'
      run: brew install pkg-config libpng

    - name: Install Ubuntu dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libpng-dev

    - name: Configure CMake
      if: matrix.os != 'windows-latest'
      shell: bash
      working-directory: libqrencode
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DWITH_TESTS=yes -DBUILD_SHARED_LIBS=on

    - name: Configure CMake for Windows
      if: matrix.os == 'windows-latest'
      shell: bash
      working-directory: libqrencode
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DWITH_TESTS=yes

    - name: Build
      working-directory: libqrencode
      shell: bash
      run: cmake --build build --config $BUILD_TYPE -j 2

    - name: Test
      working-directory: libqrencode/build
      shell: bash
      run: ctest -C $BUILD_TYPE
