            ProjectTick-ProjTLauncher-macOS-Installer-${{ env.VERSION }}.zip
            ProjectTick-ProjTLauncher-macOS-${{ env.VERSION }}.dmg
            ProjectTick-ProjTLauncher-macOS-${{ env.VERSION }}.pkg
            ProjectTick-ProjTLauncher-${{ env.VERSION }}.tar.gz
            ProjectTick-bzip2-${{ env.VERSION }}.zip
