name: CI Release

on:
  workflow_call:
    inputs:
      run-release-build:
        required: true
        type: string
      is-release:
        required: true
        type: string
    secrets:
      LINUX_GPG_KEY:
        required: false
      LINUX_GPG_ID:
        required: false
      WINGET_TOKEN:
        required: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          submodules: "true"
          path: "ProjectTick-source"

      - name: Free disk space (Linux)
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          $SUDO swapoff -a || true
          $SUDO rm -rf /swapfile || true

          $SUDO rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup || true
          $SUDO rm -rf /opt/hostedtoolcache/CodeQL || true
          $SUDO rm -rf /usr/local/share/boost /usr/local/share/powershell || true

          $SUDO apt-get clean || true
          $SUDO rm -rf /var/lib/apt/lists/* || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package source libraries
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.LINUX_GPG_ID }}
        run: |
          cd "${{ github.workspace }}"
          SRC_DIR="ProjectTick-source"
          libs=(bzip2 cgit cmark corebinutils dockerimages docs extra-cmake-modules forgewrapper gamemode javacheck javaloader json4cpp libnbtplusplus libpng libqrencode LocalPeer meta murmur2 ptlibzippy qdcss quazip rainbow systeminfo tomlplusplus)

          sign_file() {
            local path="$1"
            if [ -n "${GPG_PRIVATE_KEY}" ]; then
              echo "${GPG_PRIVATE_KEY}" | gpg --batch --yes --import
              if [ -n "${GPG_KEY_ID}" ]; then
                gpg --batch --yes --armor --default-key "${GPG_KEY_ID}" --output "${path}.asc" --detach-sign "${path}"
              else
                gpg --batch --yes --armor --output "${path}.asc" --detach-sign "${path}"
              fi
            fi
          }

          for d in "${libs[@]}"; do
            base="${d}-${{ env.VERSION }}"
            tar -C "${SRC_DIR}" -czf "${base}.tar.gz" "${d}"
            tar -C "${SRC_DIR}" -cJf "${base}.tar.xz" "${d}"
            (cd "${SRC_DIR}" && zip -r "../${base}.zip" "${d}")

            sign_file "${base}.tar.gz"
            sign_file "${base}.tar.xz"
            sign_file "${base}.zip"
          done

      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/ProjTLauncher-source ProjectTick-ProjTLauncher-${{ env.VERSION }}
          mv ProjTLauncher-Linux-Qt6-Portable*/ProjTLauncher-portable.tar.gz ProjectTick-ProjTLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ProjTLauncher-*.AppImage/ProjTLauncher-*-x86_64.AppImage ProjectTick-ProjTLauncher-Linux-x86_64.AppImage
          mv ProjTLauncher-*.AppImage.zsync/ProjTLauncher-*-x86_64.AppImage.zsync ProjectTick-ProjTLauncher-Linux-x86_64.AppImage.zsync
          mv ProjTLauncher-*.AppImage/ProjTLauncher-*-aarch64.AppImage ProjectTick-ProjTLauncher-Linux-aarch64.AppImage
          mv ProjTLauncher-*.AppImage.zsync/ProjTLauncher-*-aarch64.AppImage.zsync ProjectTick-ProjTLauncher-Linux-aarch64.AppImage.zsync
          mv ProjTLauncher-macOS*/ProjTLauncher.zip ProjectTick-ProjTLauncher-macOS-${{ env.VERSION }}.zip
          if ls ProjTLauncher-macOS*/ProjTLauncher-Installer.zip >/dev/null 2>&1; then
            mv ProjTLauncher-macOS*/ProjTLauncher-Installer.zip ProjectTick-ProjTLauncher-macOS-Installer-${{ env.VERSION }}.zip
          fi
          mv ProjTLauncher-macOS*/ProjTLauncher.dmg ProjectTick-ProjTLauncher-macOS-${{ env.VERSION }}.dmg
          mv ProjTLauncher-macOS*/ProjTLauncher-macOS-*.pkg ProjectTick-ProjTLauncher-macOS-${{ env.VERSION }}.pkg
          mv JavaCheck.jar ProjectTick-JavaCheck-${{ env.VERSION }}.jar

          tar --exclude='.git' --exclude='.github' --exclude='cgit' --exclude='corebinutils' --exclude='dockerimages' --exclude='forgewrapper' --exclude='json4cpp' --exclude='meta' --exclude='projt-minicraft-modpack' --exclude='projt-modpack' --exclude='tools' --exclude='uvim' -czf ProjTLauncher-${{ env.VERSION }}.tar.gz ProjTLauncher-${{ env.VERSION }}

          for d in ProjTLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ProjTLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ProjTLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ProjTLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ProjTLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ProjTLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ProjTLauncher-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ProjTLauncher-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ProjTLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@e798e6a1ede8d07b74ac4cdac6bdfa4cc1653907
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref }}
          name: ProjTLauncher ${{ env.VERSION }}
          draft: true
          prerelease: false
          files: |
            ProjectTick-JavaCheck-${{ env.VERSION }}.jar
            ProjectTick-ProjTLauncher-Linux-x86_64.AppImage
            ProjectTick-ProjTLauncher-Linux-x86_64.AppImage.zsync
            ProjectTick-ProjTLauncher-Linux-aarch64.AppImage
            ProjectTick-ProjTLauncher-Linux-aarch64.AppImage.zsync
            ProjectTick-ProjTLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ProjectTick-ProjTLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ProjectTick-ProjTLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            ProjectTick-ProjTLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            ProjectTick-ProjTLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            ProjectTick-ProjTLauncher-Windows-MinGW-arm64-${{ env.VERSION }}.zip
            ProjectTick-ProjTLauncher-Windows-MinGW-arm64-Portable-${{ env.VERSION }}.zip
