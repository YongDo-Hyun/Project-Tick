name: JS Fast-Check Fuzz

on:
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:
  pull_request:
    branches:
      - "develop"
      - "release-*"
    paths:
      - "projt-launcher/bot/**"
      - ".github/workflows/js-fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install && npm install fast-check
        working-directory: projt-launcher/bot
      - name: Run fast-check fuzz
        run: node bot/fuzz/fastcheck.test.js
        working-directory: projt-launcher
