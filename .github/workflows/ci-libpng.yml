name: CI libpng

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Install lint dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pip shellcheck
          python3 -m pip install --user yamllint

      - name: Install editorconfig-checker
        uses: editorconfig-checker/action-editorconfig-checker@main

      - name: Run the linting script
        shell: bash
        working-directory: libpng
        env:
          CI_YAMLLINT: /home/runner/.local/bin/yamllint
        run: bash ./ci/ci_lint.sh

  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake build-essential libtool m4 zlib1g-dev

      - name: Run the configure verification script
        working-directory: libpng
        env:
          CI_MAKE_FLAGS: -j2
          CI_SANITIZERS: address,undefined
        run: bash ./ci/ci_verify_configure.sh

  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Run the CMake verification script
        working-directory: libpng
        env:
          CI_CMAKE_GENERATOR: Xcode
          CI_CMAKE_BUILD_FLAGS: -j2
          CI_CTEST_FLAGS: -j2
        run: bash ./ci/ci_verify_cmake.sh

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Set up vcpkg cache
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', '**/vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Install dependencies
        run: |
          vcpkg install zlib:x64-windows
          vcpkg integrate install

      - name: Run the CMake verification script
        shell: bash
        working-directory: libpng
        env:
          CI_CMAKE_GENERATOR: Visual Studio 17 2022
          CI_CMAKE_GENERATOR_PLATFORM: x64
          CI_CMAKE_TOOLCHAIN_FILE: C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          CI_CMAKE_BUILD_FLAGS: -j2
          CI_CTEST_FLAGS: -j2
        run: bash ./ci/ci_verify_cmake.sh
