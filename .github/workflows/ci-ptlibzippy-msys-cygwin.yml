name: mingw/cygwin

on:
  push:
    paths:
      - 'ptlibzippy/**'
      - '.github/workflows/ci-ptlibzippy-msys-cygwin.yml'
  pull_request:
    paths:
      - 'ptlibzippy/**'
      - '.github/workflows/ci-ptlibzippy-msys-cygwin.yml'
  workflow_dispatch:

jobs:
  MSys:
    runs-on: ${{ matrix.os || 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        sys: [mingw32, mingw64, ucrt64, clang64, clangarm64]
        include:
          - sys: clangarm64
            os: windows-11-arm
    name: MSys - ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.sys }}
        update: true
        install: >-
          make
        pacboy: >-
          toolchain:p
          cmake:p
    - name: Configure
      if: matrix.sys != 'clang64'
      run: |
        src_dir="$GITHUB_WORKSPACE/ptlibzippy"
        build_dir="$src_dir/build"
        cmake -G"Unix Makefiles" \
          -S "$src_dir" \
          -B "$build_dir" \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DPTLIBZIPPY_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=ON
    - name: Configure clang64
      if: matrix.sys == 'clang64'
      run: |
        src_dir="$GITHUB_WORKSPACE/ptlibzippy"
        build_dir="$src_dir/build"
        CC=clang cmake -G"Unix Makefiles" \
          -S "$src_dir" \
          -B "$build_dir" \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DPTLIBZIPPY_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=ON
    - name: Build
      run: cmake --build "$GITHUB_WORKSPACE/ptlibzippy/build" --config Release
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$GITHUB_WORKSPACE/ptlibzippy/build" -C Release

  cygwin:
    strategy:
      fail-fast: false
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
    name: Cygwin
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: >-
          cmake
          cygwin-devel
          gcc-core
          gcc-g++
          ninja
    - name: Configure
      run: |
        src_dir="$GITHUB_WORKSPACE/ptlibzippy"
        build_dir="$src_dir/build"
        cmake -S "$src_dir" \
          -B "$build_dir" \
          -DCMAKE_BUILD_TYPE=Release \
          -DPTLIBZIPPY_BUILD_MINIZIP=ON \
          -DMINIZIP_ENABLE_BZIP2=OFF \
          -G Ninja
    - name: Build
      run: cmake --build "$GITHUB_WORKSPACE/ptlibzippy/build" --config Release -v -j1
    - name: Run tests
      run: ctest --output-on-failure --test-dir "$GITHUB_WORKSPACE/ptlibzippy/build" -C Release
