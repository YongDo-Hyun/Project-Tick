name: CI murmur2

on:
  push:
    paths:
      - 'murmur2/**'
      - '.github/workflows/ci-murmur2.yml'
  pull_request:
    paths:
      - 'murmur2/**'
      - '.github/workflows/ci-murmur2.yml'
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
permissions:
  contents: read

jobs:
  murmur2:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S murmur2 -B build/murmur2 -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/murmur2 --parallel
