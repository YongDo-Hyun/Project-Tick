name: CI forgewrapper Gradle Build

on:
  push:
    paths:
      - 'forgewrapper/**'
      - '.github/workflows/ci-build-forgewrapper.yml'
  pull_request:
    paths:
      - 'forgewrapper/**'
      - '.github/workflows/ci-build-forgewrapper.yml'
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forgewrapper

    steps:
      
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21.0.10"
          architecture: x64
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -iS
      - uses: actions/upload-artifact@v4
        with:
          name: forgewrapper-package
          path: forgewrapper/build/libs
