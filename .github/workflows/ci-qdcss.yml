name: CI qdcss

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
permissions:
  contents: read

jobs:
  qdcss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build qt6-base-dev qt6-base-dev-tools

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S qdcss -B build/qdcss -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLauncher_QT_VERSION_MAJOR=6 \
            -DQT_VERSION_MAJOR=6

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/qdcss --parallel
