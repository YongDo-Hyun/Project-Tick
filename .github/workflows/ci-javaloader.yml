name: CI Javaloader

on:
  push:
    paths:
      - 'javaloader/**'
      - '.github/workflows/ci-javaloader.yml'
  pull_request:
    paths:
      - 'javaloader/**'
      - '.github/workflows/ci-javaloader.yml'
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  javaloader:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install CMake
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S javaloader -B build/javaloader -G Ninja

      - name: Build jars
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/javaloader --parallel

      - name: Verify jar outputs
        shell: bash
        run: |
          set -euxo pipefail
          test -f build/javaloader/jars/ProjTLaunch.jar
          test -f build/javaloader/jars/ProjTLaunchLegacy.jar
