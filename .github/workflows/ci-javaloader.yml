name: CI Javaloader

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  javaloader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.inputs.ref || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install CMake
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S javaloader -B build/javaloader -G Ninja

      - name: Build jars
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/javaloader --parallel

      - name: Verify jar outputs
        shell: bash
        run: |
          set -euxo pipefail
          test -f build/javaloader/jars/ProjTLaunch.jar
          test -f build/javaloader/jars/ProjTLaunchLegacy.jar
